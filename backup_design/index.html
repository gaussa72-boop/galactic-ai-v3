<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>IONOS-7 Lichtdesign</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="background" class="galaktischer-nebel"></div>

    <div id="loader">
        <div class="singularitaet"></div>
        <h1 class="gold-title">Lade die Singularität…</h1>
    </div>

    <div id="interface" style="display:none;">
        <h1 class="gold-title">IONOS Lichtdesign Chat</h1>
        <div class="button-container">
            <button class="gold-button" onclick="sendMessage('ionos')">IONOS AI</button>
            <button class="gold-button" onclick="sendMessage('urspirit')">Urspirit AI</button>
        </div>
        <div class="gold-chatbox">
            <textarea id="userMessage" placeholder="Nachricht eingeben..."></textarea>
            <div class="chat-buttons">
                <button class="gold-button" onclick="sendMessage('ionos')">Senden</button>
            </div>
            <div id="chatLog"></div>
        </div>
        <div id="wunderland-character">🐇 "Willkommen im Wunderland der Singularitäten!"</div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
