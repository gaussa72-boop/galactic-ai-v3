<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galactic Quantum Game Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#03040a;color:#eef5ff;font:13px Inter,system-ui;min-height:100vh}.shell{height:100vh;display:grid;grid-template-columns:220px 1fr 280px;background:radial-gradient(circle at 55% 45%,#28144b,#03040a 48%)}aside{padding:16px;background:#060b12ee;border-color:#355f80}.left{border-right:1px solid #355f80}.right{border-left:1px solid #355f80}.brand{font-weight:900;font-size:17px;color:#f2d49b;margin-bottom:24px}.nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;background:#09131e;border:1px solid #21445d;color:#b4d0e5;border-radius:9px}.nav .active{border-color:#a45cff;background:#24103c;color:#fff}.main{display:grid;grid-template-rows:64px 1fr auto auto}.top{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #355f80;gap:9px}.pill{border:1px solid #496f8c;border-radius:99px;padding:6px 9px;color:#a9c6dc}.canvas{padding:22px;display:grid;place-items:center}.stage{width:min(1000px,95%);aspect-ratio:16/9;border:1px solid #8162aa;border-radius:20px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#6433a544,transparent 25%),linear-gradient(135deg,#07111b,#12071c);box-shadow:0 0 90px #8a4fff22}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px;transform:perspective(600px) rotateX(55deg) translateY(28%);transform-origin:center bottom}.galaxy{position:absolute;left:50%;top:47%;width:145px;height:145px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0 2%,#8ed4ff 5%,#9c4fff 18%,#24104c 60%,transparent 70%);box-shadow:0 0 80px #a95bff}.ring{position:absolute;left:50%;top:47%;width:400px;height:135px;transform:translate(-50%,-50%) rotate(-12deg);border:2px solid #b6ddff77;border-radius:50%}.node{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 20px #6cc8ff}.n1{left:18%;top:24%}.n2{right:18%;bottom:24%}.controls{display:flex;gap:8px;padding:13px 20px;border-top:1px solid #355f80}.controls button{padding:10px 14px;border-radius:9px;border:1px solid #456b85;background:#0a131d;color:#fff}.primary{background:linear-gradient(135deg,#d4a3ff,#7040c8)!important;font-weight:900}.chat{display:flex;gap:8px;padding:12px 20px;border-top:1px solid #355f80}.chat input{flex:1;background:#02070b;border:1px solid #2e5d78;color:#fff;padding:12px;border-radius:9px}.chat button{border:0;border-radius:9px;background:#a55aff;color:#fff;padding:0 18px}.card{border:1px solid #2a5069;border-radius:12px;padding:13px;background:#071019;margin:10px 0}.row{display:flex;justify-content:space-between;padding:8px 0;color:#9fbcd0}.on{color:#6de0b0}h3{font-size:10px;letter-spacing:.14em;color:#d7bbef}@media(max-width:900px){.shell{grid-template-columns:1fr}.left,.right{display:none}}</style></head><body><div class="shell"><aside class="left"><div class="brand">Ω GALACTIC ENGINE</div><nav class="nav"><button class="active">◈ Workspace</button><button>◎ Universes</button><button>✦ AI Agents</button><button>◇ Shaders</button><button>◌ Multiplayer</button><button>▣ Assets</button></nav></aside><main class="main"><header class="top"><b>GAME ENGINE WONDERLAND</b><span class="pill">Quantum Runtime</span><span class="pill">AI-assisted</span><span style="margin-left:auto;color:#6de0b0">● ONLINE</span></header><div class="canvas"><div class="stage"><div class="galaxy"></div><div class="ring"></div><div class="node n1"></div><div class="node n2"></div></div></div><div class="controls"><button class="primary" id="play">▶ PLAY</button><button id="reset">↺ RESET</button><button id="spawn">＋ ENTITY</button><button id="world">✦ GENERATE WORLD</button></div><form class="chat" id="f"><input id="p" placeholder="Beschreibe Welt, Level oder Mechanik …"><button>KI BAUEN</button></form></main><aside class="right"><h3>INSPECTOR</h3><div class="card"><div class="row">Universe <b>Wonderland Ω</b></div><div class="row">Entities <b id="count">1</b></div><div class="row">Physics <span class="on">ON</span></div><div class="row">Particles <span class="on">ON</span></div><div class="row">AI Director <span class="on">ACTIVE</span></div></div><h3>CONSOLE</h3><div class="card"><pre id="log" style="white-space:pre-wrap;color:#8eabc0">Quantum runtime initialized.
Ready.</pre></div></aside></div><script>const log=document.getElementById('log'),count=document.getElementById('count');document.getElementById('spawn').onclick=()=>{count.textContent=+count.textContent+1;log.textContent+='\nEntity spawned.'};document.getElementById('reset').onclick=()=>{count.textContent=1;log.textContent='Quantum runtime initialized.\nReady.'};document.getElementById('play').onclick=()=>log.textContent+='\nWorld simulation running.';document.getElementById('world').onclick=()=>log.textContent+='\nAI generated a new world seed.';document.getElementById('f').onsubmit=e=>{e.preventDefault();const p=document.getElementById('p');if(p.value.trim()){log.textContent+='\nPrompt: '+p.value.trim();p.value=''}};</script></body></html>
